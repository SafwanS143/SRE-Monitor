# Deploys the code to the EC2 specified in secrets on each push and starts the containers

name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for SSH to be ready
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          for i in {1..20}; do
            if ssh -i /tmp/ssh_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              ec2-user@${{ secrets.EC2_HOST }} echo "ready" 2>/dev/null; then
              echo "SSH is up!"
              rm /tmp/ssh_key
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          rm -f /tmp/ssh_key

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "~/sre-project"

      - name: Restart containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SLACK_WEBHOOK
          script: |
            cd ~/sre-project
            echo "SLACK_WEBHOOK=$SLACK_WEBHOOK" > .env
            docker compose down
            docker compose up -d --build
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
